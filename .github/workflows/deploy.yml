name: Deploy to VPS

# A pipeline será executada toda vez que houver um push na branch "main"
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploying application to VPS
        # Usa uma Action oficial e muito famosa para conectar na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          # Passamos o caminho da pasta onde o projeto está na VPS (ex: /root/zeni-gestao-financeira)
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            
            # Garante que as mudanças locais não vão conflitar
            git fetch --all
            git reset --hard origin/main
            
            # Dá permissão para o script e executa
            chmod +x deploy.sh
            ./deploy.sh
