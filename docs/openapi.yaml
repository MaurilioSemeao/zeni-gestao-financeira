openapi: 3.0.0
info:
  title: Zeni - API de Gestão Financeira
  description: API REST para o sistema de gestão financeira pessoal Zeni.
  version: 1.0.0
servers:
- url: https://localhost:8080
  description: SwaggerHub API Auto Mocking
- url: http://localhost:8080
  description: Servidor de Desenvolvimento Local
paths:
  /auth/newuser:
    post:
      tags:
      - Autenticação
      summary: Cria uma nova conta de usuário
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadastroRequest"
        required: true
      responses:
        "201":
          description: Usuário criado com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioResponse"
  /auth/login:
    post:
      tags:
      - Autenticação
      summary: Autentica um usuário
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Autenticação bem-sucedida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Não autorizado. Credenciais inválidas.
  /usuario:
    get:
      tags:
      - Usuários
      summary: Lista todos os usuários
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    post:
      tags:
      - Usuários
      summary: Cria um novo usuário
      responses:
        "201":
          description: Criado
      security:
      - bearerAuth: []
  /usuario/{id}:
    get:
      tags:
      - Usuários
      summary: Retorna um usuário
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    put:
      tags:
      - Usuários
      summary: Atualiza um usuário
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    delete:
      tags:
      - Usuários
      summary: Exclui um usuário
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Sucesso
      security:
      - bearerAuth: []
  /carteiras:
    get:
      tags:
      - Carteiras
      summary: Lista as carteiras
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    post:
      tags:
      - Carteiras
      summary: Cria uma nova carteira
      responses:
        "201":
          description: Criado
      security:
      - bearerAuth: []
  /carteiras/{id}:
    get:
      tags:
      - Carteiras
      summary: Retorna uma carteira
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    put:
      tags:
      - Carteiras
      summary: Atualiza uma carteira
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    delete:
      tags:
      - Carteiras
      summary: Exclui uma carteira
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Sucesso
      security:
      - bearerAuth: []
  /categoria:
    get:
      tags:
      - Categorias
      summary: Lista as categorias do usuário
      responses:
        "200":
          description: Sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoriaResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Categorias
      summary: Cria uma nova categoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
      security:
      - bearerAuth: []
  /categoria/{id}:
    get:
      tags:
      - Categorias
      summary: Retorna uma categoria
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    put:
      tags:
      - Categorias
      summary: Atualiza uma categoria
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Categorias
      summary: Exclui uma categoria
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Categoria excluída
      security:
      - bearerAuth: []
  /contas:
    get:
      tags:
      - Contas
      summary: Lista as contas do usuário
      responses:
        "200":
          description: Lista de contas retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContaResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Contas
      summary: Cria uma nova conta
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContaRequest"
        required: true
      responses:
        "201":
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContaResponse"
      security:
      - bearerAuth: []
  /contas/{id}:
    get:
      tags:
      - Contas
      summary: Retorna uma conta
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    put:
      tags:
      - Contas
      summary: Atualiza uma conta
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    delete:
      tags:
      - Contas
      summary: Exclui uma conta
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Sucesso
      security:
      - bearerAuth: []
  /cartoes:
    get:
      tags:
      - Cartões de Crédito
      summary: Lista os cartões de crédito do usuário
      responses:
        "200":
          description: Lista de cartões retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartaoCreditoResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Cartões de Crédito
      summary: Cadastra um novo cartão de crédito
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartaoCreditoRequest"
        required: true
      responses:
        "201":
          description: Cartão criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartaoCreditoResponse"
      security:
      - bearerAuth: []
  /cartoes/{id}:
    get:
      tags:
      - Cartões de Crédito
      summary: Retorna um cartão
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    put:
      tags:
      - Cartões de Crédito
      summary: Atualiza um cartão
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    delete:
      tags:
      - Cartões de Crédito
      summary: Exclui um cartão
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Sucesso
      security:
      - bearerAuth: []
  /extratomensal:
    get:
      tags:
      - Extrato Mensal
      summary: Lista os extratos
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    post:
      tags:
      - Extrato Mensal
      summary: Cria extrato
      responses:
        "201":
          description: Criado
      security:
      - bearerAuth: []
  /extratomensal/{id}:
    get:
      tags:
      - Extrato Mensal
      summary: Retorna um extrato
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    put:
      tags:
      - Extrato Mensal
      summary: Atualiza extrato
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    delete:
      tags:
      - Extrato Mensal
      summary: Exclui extrato
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Sucesso
      security:
      - bearerAuth: []
  /transacoes:
    get:
      tags:
      - Transações
      summary: Lista as transações
      responses:
        "200":
          description: Lista retornada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransacaoResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Transações
      summary: Registra uma nova transação
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransacaoRequest"
        required: true
      responses:
        "201":
          description: Transação criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransacaoResponse"
      security:
      - bearerAuth: []
  /transacoes/{id}:
    get:
      tags:
      - Transações
      summary: Retorna uma transacao
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
    put:
      tags:
      - Transações
      summary: Atualiza uma transação
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransacaoRequest"
        required: true
      responses:
        "200":
          description: Transação atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransacaoResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - Transações
      summary: Exclui uma transação
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Transação excluída
      security:
      - bearerAuth: []
  /transacoes/extratomensal/{id}:
    get:
      tags:
      - Transações
      summary: Retorna transacoes por extrato
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
  /dashboard/resumoCategoria:
    get:
      tags:
      - Dashboard & Relatórios
      summary: Retorna dados para o dashboard
      responses:
        "200":
          description: Sucesso
      security:
      - bearerAuth: []
components:
  schemas:
    CadastroRequest:
      type: object
      properties:
        nome:
          type: string
          example: Usuário Exemplo
        email:
          type: string
          format: email
          example: usuario@example.com
        senha:
          type: string
          format: password
          example: senhaForte123
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: usuario@example.com
        senha:
          type: string
          format: password
          example: senhaForte123
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: "#/components/schemas/UsuarioResponse"
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        tipoUsuario:
          type: string
          enum:
          - PADRAO
          - ADMIN
    TransacaoRequest:
      type: object
      properties:
        descricao:
          type: string
          example: Almoço no restaurante
        valor:
          type: number
          format: double
          example: 45.5
        data:
          type: string
          format: date
          example: 2025-10-13
        tipo:
          type: string
          enum:
          - RECEITA
          - DESPESA
        categoriaId:
          type: integer
          format: int64
        contaId:
          type: integer
          format: int64
          nullable: true
        cartaoId:
          type: integer
          format: int64
          nullable: true
    TransacaoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        descricao:
          type: string
        valor:
          type: number
          format: double
        data:
          type: string
          format: date
        tipo:
          type: string
        categoriaNome:
          type: string
    CategoriaRequest:
      type: object
      properties:
        nome:
          type: string
          example: Lazer
        limiteGasto:
          type: number
          format: double
          example: 500
    CategoriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        limiteGasto:
          type: number
          format: double
    ContaRequest:
      type: object
      properties:
        nomePersonalizado:
          type: string
          example: Conta Corrente Principal
        tipo:
          type: string
          enum:
          - CONTA_CORRENTE
          - POUPANCA
          - CARTEIRA
    ContaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nomePersonalizado:
          type: string
        tipo:
          type: string
    CartaoCreditoRequest:
      type: object
      properties:
        nomeApelido:
          type: string
          example: Cartão Principal
        bandeira:
          type: string
          example: Visa
        diaVencimento:
          type: integer
          example: 10
    CartaoCreditoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nomeApelido:
          type: string
        bandeira:
          type: string
    FaturaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mesReferencia:
          type: string
          example: 2025-10
        valorTotal:
          type: number
          format: double
        status:
          type: string
          enum:
          - ABERTA
          - FECHADA
          - PAGA
          - VENCIDA
    FaturaDetalhadaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mesReferencia:
          type: string
          example: 2025-10
        valorTotal:
          type: number
          format: double
        status:
          type: string
        transacoes:
          type: array
          items:
            $ref: "#/components/schemas/TransacaoResponse"
    DashboardResponse:
      type: object
      properties:
        saldoGeral:
          type: number
          format: double
        totalReceitasMes:
          type: number
          format: double
        totalDespesasMes:
          type: number
          format: double
        limitesPorCategoria:
          type: array
          items:
            $ref: "#/components/schemas/DashboardResponse_limitesPorCategoria"
    DashboardResponse_limitesPorCategoria:
      type: object
      properties:
        categoriaNome:
          type: string
        valorGasto:
          type: number
          format: double
        valorLimite:
          type: number
          format: double
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
